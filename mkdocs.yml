# MkDocs settings for the public docs site. prepare_site.py adds the page
# list ("nav") below and writes the result to the public repo's mkdocs.yml.

site_name: Oaklands Modding
site_description: How to make mods for Oaklands.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search

nav:
  - "Home": index.md
  - "Content files": content.md
  - "Scripts and the sandbox": sandbox.md
  - "Examples": examples.md
  - "API reference":
      - "Mod": api/Mod.md
      - "ModChat": api/ModChat.md
      - "ModCommands": api/ModCommands.md
      - "ModContext": api/ModContext.md
      - "ModEffects": api/ModEffects.md
      - "ModEvents": api/ModEvents.md
      - "ModInput": api/ModInput.md
      - "ModItems": api/ModItems.md
      - "ModLog": api/ModLog.md
      - "ModMaterials": api/ModMaterials.md
      - "ModNetwork": api/ModNetwork.md
      - "ModSettings": api/ModSettings.md
      - "ModTimers": api/ModTimers.md
      - "ModTrees": api/ModTrees.md
      - "ModUI": api/ModUI.md
      - "ModVehicles": api/ModVehicles.md
      - "ModWorld": api/ModWorld.md
      - "NetData": api/NetData.md
      - "Sound": api/Sound.md
